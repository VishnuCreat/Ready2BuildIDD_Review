[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ready2build-iid-review"
version = "0.1.0"
description = "Dry-run-first Jira IDD review queue processor"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
documents = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
web = ["streamlit>=1.35"]
test = ["pytest>=8.0"]

[project.scripts]
ready2build = "ready2build.cli:main"
ready2build-poc = "ready2build.manual_server:main"
ready2build-streamlit-poc = "ready2build.web:main"

[tool.setuptools.packages.find]
include = ["ready2build*"]
